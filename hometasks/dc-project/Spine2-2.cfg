! Command: show running-config
! device: Spine2-2 (vEOS-lab, EOS-4.29.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Spine2-2
!
spanning-tree mode mstp
!
interface Ethernet1
   mtu 9000
   speed forced 1000full
   no switchport
   ipv6 enable
   isis enable SITE2-UNDERLAY
   no isis bfd
   isis ipv6 bfd
   isis circuit-type level-1
   isis network point-to-point
   isis authentication mode sha key-id 33333
   isis authentication key-id 33333 algorithm sha-256 key 7 c5BPalp9TiCbuLtUkZmu+g==
!
interface Ethernet2
   mtu 9000
   speed forced 1000full
   no switchport
   ipv6 enable
   isis enable SITE2-UNDERLAY
   no isis bfd
   isis ipv6 bfd
   isis circuit-type level-1
   isis network point-to-point
   isis authentication mode sha key-id 33333
   isis authentication key-id 33333 algorithm sha-256 key 7 c5BPalp9TiCbuLtUkZmu+g==
!
interface Ethernet3
   mtu 9000
   speed forced 1000full
   no switchport
   ipv6 enable
   isis enable SITE2-UNDERLAY
   no isis bfd
   isis ipv6 bfd
   isis circuit-type level-1
   isis network point-to-point
   isis authentication mode sha key-id 33333
   isis authentication key-id 33333 algorithm sha-256 key 7 c5BPalp9TiCbuLtUkZmu+g==
!
interface Loopback0
   ipv6 address fd12:dc2:1::2/128
   isis enable SITE2-UNDERLAY
   isis circuit-type level-1
!
interface Management1
!
no ip routing
!
ipv6 unicast-routing
!
router bgp 64522
   router-id 10.2.1.2
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 2 ecmp 2
   bgp listen range fd12:dc2:1::/64 peer-group SITE2-LEAVES remote-as 64522
   neighbor SITE2-LEAVES peer group
   neighbor SITE2-LEAVES update-source Loopback0
   neighbor SITE2-LEAVES route-reflector-client
   neighbor SITE2-LEAVES send-community extended
   neighbor SITE2-LEAVES maximum-routes 0
   !
   address-family evpn
      neighbor SITE2-LEAVES activate
   !
   address-family ipv4
      no neighbor SITE2-LEAVES activate
   !
   address-family ipv6
      no neighbor SITE2-LEAVES activate
!
router isis SITE2-UNDERLAY
   net 49.0002.0100.0200.1002.00
   authentication mode sha key-id 33333
   authentication key-id 33333 algorithm sha-256 key 7 c5BPalp9TiCbuLtUkZmu+g==
   !
   address-family ipv6 unicast
!
end
