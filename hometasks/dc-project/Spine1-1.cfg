! Command: show running-config
! device: Spine1-1 (vEOS-lab, EOS-4.29.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Spine1-1
!
spanning-tree mode mstp
!
interface Ethernet1
   mtu 9000
   speed forced 1000full
   no switchport
   ipv6 enable
   isis enable SITE1-UNDERLAY
   no isis bfd
   isis ipv6 bfd
   isis circuit-type level-1
   isis network point-to-point
   isis authentication mode sha key-id 33333
   isis authentication key-id 33333 algorithm sha-256 key 7 fQ2hST20Ozo7y2Zpdxveag==
!
interface Ethernet2
   mtu 9000
   speed forced 1000full
   no switchport
   ipv6 enable
   isis enable SITE1-UNDERLAY
   no isis bfd
   isis ipv6 bfd
   isis circuit-type level-1
   isis network point-to-point
   isis authentication mode sha key-id 33333
   isis authentication key-id 33333 algorithm sha-256 key 7 fQ2hST20Ozo7y2Zpdxveag==
!
interface Ethernet3
   mtu 9000
   speed forced 1000full
   no switchport
   ipv6 enable
   isis enable SITE1-UNDERLAY
   no isis bfd
   isis ipv6 bfd
   isis circuit-type level-1
   isis network point-to-point
   isis authentication mode sha key-id 33333
   isis authentication key-id 33333 algorithm sha-256 key 7 fQ2hST20Ozo7y2Zpdxveag==
!
interface Loopback0
   ipv6 address fd12:dc1:1::1/128
   isis enable SITE1-UNDERLAY
   isis circuit-type level-1
!
interface Management1
   ip address 192.168.3.241/24
!
no ip routing
!
ipv6 unicast-routing
!
router bgp 64521
   router-id 10.1.1.1
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 2 ecmp 2
   bgp listen range fd12:dc1:1::/64 peer-group SITE1-LEAVES remote-as 64521
   neighbor SITE1-LEAVES peer group
   neighbor SITE1-LEAVES update-source Loopback0
   neighbor SITE1-LEAVES route-reflector-client
   neighbor SITE1-LEAVES send-community extended
   neighbor SITE1-LEAVES maximum-routes 0
   !
   address-family evpn
      neighbor SITE1-LEAVES activate
   !
   address-family ipv4
      no neighbor SITE1-LEAVES activate
   !
   address-family ipv6
      no neighbor SITE1-LEAVES activate
!
router isis SITE1-UNDERLAY
   net 49.0001.0100.0100.1001.00
   authentication mode sha key-id 33333
   authentication key-id 33333 algorithm sha-256 key 7 fQ2hST20Ozo7y2Zpdxveag==
   !
   address-family ipv6 unicast
!
end
