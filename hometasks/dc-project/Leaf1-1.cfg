! Command: show running-config
! device: Leaf1-1 (vEOS-lab, EOS-4.29.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Leaf1-1
!
spanning-tree mode mstp
!
vlan 10
   name PROD
!
vlan 20
   name DEV
!
vrf instance VRF2026
!
interface Ethernet1
   mtu 9000
   speed forced 1000full
   no switchport
   ipv6 enable
   isis enable SITE1-UNDERLAY
   no isis bfd
   isis ipv6 bfd
   isis circuit-type level-1
   isis network point-to-point
   isis authentication mode sha key-id 33333
   isis authentication key-id 33333 algorithm sha-256 key 7 fQ2hST20Ozo7y2Zpdxveag==
!
interface Ethernet2
   mtu 9000
   speed forced 1000full
   no switchport
   ipv6 enable
   isis enable SITE1-UNDERLAY
   no isis bfd
   isis ipv6 bfd
   isis circuit-type level-1
   isis network point-to-point
   isis authentication mode sha key-id 33333
   isis authentication key-id 33333 algorithm sha-256 key 7 fQ2hST20Ozo7y2Zpdxveag==
!
interface Ethernet3
   speed forced 1000full
   switchport access vlan 10
!
interface Ethernet4
   speed forced 1000full
   switchport access vlan 20
!
interface Ethernet5
   speed forced 1000full
!
interface Loopback0
   ipv6 address fd12:dc1:1::3/128
   isis enable SITE1-UNDERLAY
   isis circuit-type level-1
!
interface Management1
!
interface Vlan10
   vrf VRF2026
   ip address 10.10.1.211/24
   ip virtual-router address 10.10.1.254
!
interface Vlan20
   vrf VRF2026
   ip address 10.20.1.211/24
   ip virtual-router address 10.20.1.254
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan encapsulation ipv6
   vxlan vlan 10 vni 1000010
   vxlan vlan 20 vni 1000020
   vxlan vrf VRF2026 vni 1111111
   vxlan learn-restrict any
!
ip virtual-router mac-address 00:00:00:00:00:01
!
no ip routing
ip routing vrf VRF2026
!
ipv6 unicast-routing
!
router bgp 64521
   router-id 10.1.1.3
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 2 ecmp 2
   neighbor SITE1-SPINES peer group
   neighbor SITE1-SPINES remote-as 64521
   neighbor SITE1-SPINES update-source Loopback0
   neighbor SITE1-SPINES send-community extended
   neighbor fd12:dc1:1::1 peer group SITE1-SPINES
   neighbor fd12:dc1:1::2 peer group SITE1-SPINES
   !
   vlan 10
      rd auto
      route-target both 10:1000010
      redistribute learned
   !
   vlan 20
      rd auto
      route-target both 20:1000020
      redistribute learned
   !
   address-family evpn
      neighbor SITE1-SPINES activate
   !
   address-family ipv4
      no neighbor SITE1-SPINES activate
   !
   address-family ipv6
      no neighbor SITE1-SPINES activate
   !
   vrf VRF2026
      rd 64521:3
      route-target import evpn 1:1111111
      route-target export evpn 1:1111111
      redistribute connected
!
router isis SITE1-UNDERLAY
   net 49.0001.0100.0100.1003.00
   authentication mode sha key-id 33333
   authentication key-id 33333 algorithm sha-256 key 7 fQ2hST20Ozo7y2Zpdxveag==
   !
   address-family ipv6 unicast
!
end
