! Command: show running-config
! device: BGW2-1 (vEOS-lab, EOS-4.29.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname BGW2-1
!
spanning-tree mode mstp
!
vlan 10
   name PROD
!
vlan 20
   name DEV
!
vrf instance VRF2026
!
interface Ethernet1
   mtu 9000
   speed forced 1000full
   no switchport
   ipv6 enable
   isis enable SITE2-UNDERLAY
   no isis bfd
   isis ipv6 bfd
   isis circuit-type level-1
   isis network point-to-point
   isis authentication mode sha key-id 33333
   isis authentication key-id 33333 algorithm sha-256 key 7 c5BPalp9TiCbuLtUkZmu+g==
!
interface Ethernet2
   mtu 9000
   speed forced 1000full
   no switchport
   ipv6 enable
   isis enable SITE2-UNDERLAY
   no isis bfd
   isis ipv6 bfd
   isis circuit-type level-1
   isis network point-to-point
   isis authentication mode sha key-id 33333
   isis authentication key-id 33333 algorithm sha-256 key 7 c5BPalp9TiCbuLtUkZmu+g==
!
interface Ethernet3
   mtu 9000
   speed forced 1000full
   no switchport
   ipv6 enable
   ipv6 address fd12:dc2:1:201::2/64
!
interface Ethernet4
   speed forced 1000full
   no switchport
!
interface Ethernet5
   speed forced 1000full
   no switchport
!
interface Loopback0
   ipv6 address fd12:dc2:1::4/128
   isis enable SITE2-UNDERLAY
   isis circuit-type level-1
!
interface Loopback1
   ipv6 address fd12:dc2:100::100/128
   isis instance SITE2-UNDERLAY
   isis circuit-type level-1
!
interface Management1
!
interface Vlan10
   vrf VRF2026
   ip address 10.10.1.223/24
!
interface Vlan20
   vrf VRF2026
   ip address 10.20.1.223/24
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address 00:00:02:0a:fe:02
   vxlan udp-port 4789
   vxlan encapsulation ipv6
   vxlan vlan 10 vni 1000010
   vxlan vlan 20 vni 1000020
   vxlan vrf VRF2026 vni 1111111
   vxlan learn-restrict any
!
no ip routing
ip routing vrf VRF2026
!
ipv6 unicast-routing
!
ipv6 route ::/0 fd12:dc2:1:201::1
!
router bgp 64522
   router-id 10.2.1.4
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 2 ecmp 2
   neighbor DCI peer group
   neighbor DCI remote-as 64520
   neighbor DCI bfd
   neighbor SITE1-BGWS peer group
   neighbor SITE1-BGWS remote-as 64521
   neighbor SITE1-BGWS update-source Loopback0
   neighbor SITE1-BGWS ebgp-multihop 2
   neighbor SITE1-BGWS send-community extended
   neighbor SITE2-SPINES peer group
   neighbor SITE2-SPINES remote-as 64522
   neighbor SITE2-SPINES update-source Loopback0
   neighbor SITE2-SPINES send-community extended
   neighbor fd12:dc1:1::4 peer group SITE1-BGWS
   neighbor fd12:dc1:1::5 peer group SITE1-BGWS
   neighbor fd12:dc2:1::1 peer group SITE2-SPINES
   neighbor fd12:dc2:1::2 peer group SITE2-SPINES
   neighbor fd12:dc2:1:201::1 peer group DCI
   !
   vlan 10
      rd evpn domain all 10.2.1.4:10
      route-target both 10:1000010
      route-target import export evpn domain remote 10:10
      redistribute learned
   !
   vlan 20
      rd evpn domain all 10.2.1.4:20
      route-target both 20:1000020
      route-target import export evpn domain remote 20:20
      redistribute learned
   !
   address-family evpn
      no neighbor DCI activate
      neighbor SITE1-BGWS activate
      neighbor SITE1-BGWS domain remote
      neighbor SITE2-SPINES activate
      neighbor default next-hop-self received-evpn-routes route-type ip-prefix inter-domain
   !
   address-family ipv4
      no neighbor DCI activate
      no neighbor SITE1-BGWS activate
      no neighbor SITE2-SPINES activate
   !
   address-family ipv6
      neighbor DCI activate
      no neighbor SITE1-BGWS activate
      no neighbor SITE2-SPINES activate
      network fd12:dc2:1::4/128
      network fd12:dc2:100::100/128
   !
   vrf VFR2026
      rd 64522:4
      route-target import evpn 1:1111111
      route-target export evpn 1:1111111
      redistribute connected
!
router isis SITE2-UNDERLAY
   net 49.0002.0100.0200.1004.00
   authentication mode sha key-id 33333
   authentication key-id 33333 algorithm sha-256 key 7 c5BPalp9TiCbuLtUkZmu+g==
   !
   address-family ipv6 unicast
!
end
