! Command: show running-config
! device: Leaf1 (vEOS-lab, EOS-4.29.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Leaf1
!
spanning-tree mode mstp
!
vlan 10
   name PROD
!
vlan 20
   name DEV
!
interface Ethernet1
   mtu 9000
   no switchport
   ipv6 enable
   isis enable UNDERLAY
   no isis bfd
   isis ipv6 bfd
   isis circuit-type level-1
   isis network point-to-point
   isis authentication mode sha key-id 33333
   isis authentication key-id 33333 algorithm sha-256 key 7 a8n1JXStqfBfR+URg/kKog==
!
interface Ethernet2
   mtu 9000
   no switchport
   ipv6 enable
   isis enable UNDERLAY
   no isis bfd
   isis ipv6 bfd
   isis circuit-type level-1
   isis network point-to-point
   isis authentication mode sha key-id 33333
   isis authentication key-id 33333 algorithm sha-256 key 7 a8n1JXStqfBfR+URg/kKog==
!
interface Ethernet3
   switchport access vlan 10
!
interface Loopback0
   ipv6 address fd12:dc1:1:2::1/128
   isis enable UNDERLAY
!
interface Management1
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan encapsulation ipv6
   vxlan vlan 10 vni 1000010
   vxlan vlan 20 vni 1000020
!
no ip routing
!
ipv6 unicast-routing
!
router bgp 64521
   router-id 10.1.1.3
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor SPINES peer group
   neighbor SPINES remote-as 64520
   neighbor SPINES update-source Loopback0
   neighbor SPINES ebgp-multihop 2
   neighbor SPINES send-community extended
   neighbor fd12:dc1:1::1 peer group SPINES
   neighbor fd12:dc1:1::2 peer group SPINES
   !
   vlan 10
      rd 1.1.1.3:10
      route-target both 64520:1000010
      redistribute learned
   !
   vlan 20
      rd 1.1.1.3:20
      route-target both 64520:1000020
      redistribute learned
   !
   address-family evpn
      neighbor SPINES activate
   !
   address-family ipv4
      no neighbor SPINES activate
   !
   address-family ipv6
      neighbor SPINES activate
!
router isis UNDERLAY
   net 49.0001.0100.0100.1003.00
   authentication mode sha key-id 33333
   authentication key-id 33333 algorithm sha-256 key 7 a8n1JXStqfBfR+URg/kKog== level-1
   !
   address-family ipv6 unicast
!
end
