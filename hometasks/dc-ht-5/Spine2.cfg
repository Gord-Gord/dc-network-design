! Command: show running-config
! device: Spine2 (vEOS-lab, EOS-4.29.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname Spine2
!
spanning-tree mode mstp
!
interface Ethernet1
   mtu 9000
   no switchport
   ipv6 enable
   isis enable UNDERLAY
   no isis bfd
   isis ipv6 bfd
   isis circuit-type level-1
   isis network point-to-point
   isis authentication mode sha key-id 33333
   isis authentication key-id 33333 algorithm sha-256 key 7 a8n1JXStqfBfR+URg/kKog==
!
interface Ethernet2
   mtu 9000
   no switchport
   ipv6 enable
   isis enable UNDERLAY
   no isis bfd
   isis ipv6 bfd
   isis circuit-type level-1
   isis network point-to-point
   isis authentication mode sha key-id 33333
   isis authentication key-id 33333 algorithm sha-256 key 7 a8n1JXStqfBfR+URg/kKog==
!
interface Ethernet3
   mtu 9000
   no switchport
   ipv6 enable
   isis enable UNDERLAY
   no isis bfd
   isis ipv6 bfd
   isis circuit-type level-1
   isis network point-to-point
   isis authentication mode sha key-id 33333
   isis authentication key-id 33333 algorithm sha-256 key 7 a8n1JXStqfBfR+URg/kKog==
!
interface Ethernet4
!
interface Ethernet5
!
interface Loopback0
   ipv6 address fd12:dc1:1::2/128
   isis enable UNDERLAY
   isis circuit-type level-1
!
interface Management1
!
no ip routing
!
ipv6 unicast-routing
!
peer-filter LEAF-AS-NUMBERS
   10 match as-range 64512-64535 result accept
!
router bgp 64520
   router-id 10.1.1.2
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   bgp listen range fd12:dc1:1:2::/64 peer-group LEAVES peer-filter LEAF-AS-NUMBERS
   neighbor LEAVES peer group
   neighbor LEAVES update-source Loopback0
   neighbor LEAVES ebgp-multihop 2
   neighbor LEAVES route-reflector-client
   neighbor LEAVES send-community extended
   neighbor LEAVES maximum-routes 0
   !
   address-family evpn
      neighbor LEAVES activate
   !
   address-family ipv4
      no neighbor LEAVES activate
   !
   address-family ipv6
      neighbor LEAVES activate
!
router isis UNDERLAY
   net 49.0001.0100.0100.1002.00
   authentication mode sha key-id 33333
   authentication key-id 33333 algorithm sha-256 key 7 a8n1JXStqfBfR+URg/kKog== level-1
   !
   address-family ipv6 unicast
!
end
